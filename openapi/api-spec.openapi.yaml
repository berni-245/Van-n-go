  /bookings:
    get:
      summary: List bookings
      description: >
        Retrieves a user's bookings.
      parameters:
        - name: userId
          in: query
          description: Filter bookings where the userId is a participant of a booking.
          required: true
          schema:
            type: integer
        - name: state
          in: query
          description: Filter bookings based on status
          required: true
          schema:
            type: string
            enum: [ PENDING, ACCEPTED, FINISHED, REJECTED, CANCELED ]
        - $ref: "#/components/parameters/PaginationQuery"
      operationId: listBookings
      tags:
        - Bookings
      responses:
        "200":
          description: List of bookings
          headers:
            Link:
              $ref: "schemas/headers/link.yaml"
              example: </bookings?page=2>; rel="next"
          content:
            application/vnd.bookingList.v1+json:
              schema:
                type: array
                items:
                  $ref: "schemas/responses/booking.yaml"
        "400":
          $ref: "schemas/errors/bad-request.yaml"
          description: >
            Possible errors `type`s: USER_ID_NOT_PROVIDED, PAGE_OUT_OF_BOUNDS.
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: USER_IDENTITY_MISMATCH.
    post:
      summary: Create a new booking
      description: As a client, create a new booking
      operationId: createBooking
      tags:
        - Bookings
      requestBody:
        required: true
        description: >
          Information required to create a new booking.\

          This operation will fail if the vehicle is already booked at the specified time.
        content:
          application/vnd.bookingCreate.v1+json:
            schema:
              $ref: "schemas/requests/booking-create.yaml"
      responses:
        "201":
          description: Booking created
          headers:
            Location:
              description: URI of the created booking
              schema:
                type: string
                example: "api/bookings/42"
          content:
            application/vnd.booking.v1+json:
              schema:
                $ref: "schemas/responses/booking.yaml"
        "400":
          $ref: "schemas/errors/bad-request-form.yaml"
          description: |
            Possible errors `type`s: INVALID_ARGUMENTS (see subtypes and entities for this one).

            Possible errors `subtype`s for each `entity` (entity: subtype1, subtype2, ...):

            vehicleId:
              - NotNull: value must not be null

            originZoneId:
              - ValidZoneId: must be a zoneId that exists in the `/zones` endpoint
              - NotNull: value must not be null
            
            destinationZoneId:
              - ValidZoneId: must be a zoneId that exists in the `/zones` endpoint
              - NotNull: value must not be null

            jobDescription:
              - Length: must be between 5 and 500 characters
              - NotNull: value must not be null
            
            date:
              - Future: la fecha tiene que ser futura a la actual
              - NotNull: value must not be null
            
            shiftPeriod:
              - NotNull: value must not be null
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: ACCESS_DENIED (if user type is not client)
        "404":
          $ref: "schemas/errors/not-found.yaml"
          description: >
            Possible errors `type`s: VEHICLE_NOT_FOUND
        "409":
          $ref: "schemas/errors/conflict.yaml"
          description: >
            Possible errors `type`s: TIME_ALREADY_PASSED, VEHICLE_NOT_AVAILABLE, VEHICLE_IS_ALREADY_ACCEPTED, CLIENT_ALREADY_APPOINTED
  /bookings/{bookingId}:
    get:
      parameters:
        - $ref: "#/components/parameters/BookingIdPath"
      summary: Get booking by ID
      description: Get booking information given a booking ID.
      operationId: getBookingById
      tags:
        - Bookings
      responses:
        "200":
          description: Booking found
          content:
            application/vnd.booking.v1+json:
              schema:
                $ref: "schemas/responses/booking.yaml"
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: FORBIDDEN_USER_BOOKING_ACCESS
    patch:
      parameters:
        - $ref: "#/components/parameters/BookingIdPath"
      summary: Update booking state with given ID
      description: Update booking state with given bookingId, the booking must belong to the auth user.
      operationId: updateBookingState
      tags:
        - Bookings
      requestBody:
        required: true
        description: >
          Auth user must be in booking with bookingId. 
          You can update booking state from PENDING to REJECTED/ACCEPTED if auth user is driver, 
          from ACCEPTED to CANCELED if payment was not made for booking (can be either role), 
          and from ACCEPTED to FINISHED if payment was made and auth user is driver.
        content:
          application/vnd.bookingUpdateState.v1+json:
            schema:
              $ref: "schemas/requests/booking-update-state.yaml"
      responses:
        "200":
          description: Booking state successfully updated
          content:
            application/vnd.booking.v1+json:
              schema:
                $ref: "schemas/responses/booking.yaml"
        "400":
          $ref: "schemas/errors/bad-request-form.yaml"
          description: |
            Possible errors `type`s: INVALID_ARGUMENTS (see subtypes and entities for this one).

            Possible errors `subtype`s for each `entity` (entity: subtype1, subtype2, ...):

            state:
              - Pattern: The new state must be one of the following: ACCEPTED, REJECTED, FINISHED, CANCELED
              - NotNull: value must not be null
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: FORBIDDEN_USER_BOOKING_ACCESS, FORBIDDEN_BOOKING_STATE_OPERATION, FORBIDDEN_DRIVER_CANCEL_BOOKING, FORBIDDEN_CLIENT_CANCEL_BOOKING
        "409":
          $ref: "schemas/errors/conflict.yaml"
          description: >
            Possible errors `type`s: VEHICLE_IS_ALREADY_ACCEPTED

  /bookings/{bookingId}/review:
    get:
      parameters:
        - $ref: "#/components/parameters/BookingIdPath"
      summary: Get booking review
      description: Get booking review given a booking ID.
      operationId: getReview
      tags:
        - Bookings
      responses:
        "200":
          description: Review found
          content:
            application/vnd.bookingReview.v1+json:
              schema:
                $ref: "schemas/responses/booking-review.yaml"
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: FORBIDDEN_USER_BOOKING_ACCESS
        "404":
          $ref: "schemas/errors/not-found.yaml"
    post:
      parameters:
        - $ref: "#/components/parameters/BookingIdPath"
      summary: Set booking review
      description: Set booking review given a booking id.
      operationId: updateBookingReview
      tags:
        - Bookings
      requestBody:
        required: true
        description: >
          Booking review information. This can only be done once by the client that belongs to the booking id.
        content:
          application/vnd.bookingReview.v1+json:
            schema:
              $ref: "schemas/responses/booking-review.yaml"
      responses:
        "201":
          description: Booking review successfully created
          Location:
            description: URI of the uploaded review
            schema:
              type: string
              example: "api/bookings/42/review"
          content:
            application/vnd.bookingReview.v1+json:
              schema:
                $ref: "schemas/responses/booking-review.yaml"
        "400":
          $ref: "schemas/errors/bad-request-form.yaml"
          description: |
            Possible errors `type`s: INVALID_ARGUMENTS (see subtypes and entities for this one).

            Possible errors `subtype`s for each `entity` (entity: subtype1, subtype2, ...):

            rating:
              - Min: The minimum rating is 1 star
              - Max: The maximum rating are 5 stars
              - NotNull: value must not be null
            
            comments:
              - Length: must have less than 255 characters
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: ACCESS_DENIED (if user type is not client), FORBIDDEN_USER_BOOKING_ACCESS
        "409":
          $ref: "schemas/errors/conflict.yaml"
          description: >
            Possible errors `type`s: REVIEW_ALREADY_SENT


