  /messages:
    get:
      parameters:
        - $ref: "#/components/parameters/DriverIdQuery"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/PaginationQuery"
      tags:
        - Messages
      summary: Get messages between a client and a driver
      operationId: listMessages
      responses:
        "200":
          description: List of messages between client and driver
          headers:
            Link:
              $ref: "schemas/headers/link.yaml"
              example: </drivers?page=2>; rel="next"
          content:
            application/vnd.messageList.v1+json:
              schema:
                $ref: "schemas/responses/messages.yaml"
              example:

                  - id: 1
                    content: "Hola"
                    sentByDriver: true
                    timestamp: "2026-01-10T18:30:00Z"
                  - id: 2
                    sentByDriver: false
                    content: "Ya llego"
                    timestamp: "2026-01-10T18:32:00Z"
        "400":
          $ref: "schemas/errors/bad-request.yaml"
          description: >
            Possible errors `type`s: PAGE_OUT_OF_BOUNDS
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: USER_IDENTITY_MISMATCH, FORBIDDEN_CONVERSATION
    post:
      tags:
        - Messages
      summary: Send a new message
      description: Creates a new message between a client and a driver.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/vnd.messageCreate.v1+json:
            schema:
              type: object
              required: [ clientId, driverId, message ]
              properties:
                clientId:
                  type: integer
                  example: 1
                driverId:
                  type: integer
                  example: 2
                message:
                  type: string
                  example: "Hola, llego en 5 minutos."
      responses:
        "201":
          description: Message created
          headers:
            Location:
              description: URI of the created message
              schema:
                type: string
                example: "api/messages/42"
          content:
            application/vnd.message.v1+json:
              schema:
                $ref: "schemas/responses/message.yaml"
        "400":
          $ref: "schemas/errors/bad-request-form.yaml"
          description: |
            Possible errors `type`s: INVALID_ARGUMENTS (see subtypes and entities for this one).

            Possible errors `subtype`s for each `entity` (entity: subtype1, subtype2, ...):

            clientId:
              - NotNull: value must not be null
            
            driverId:
              - NotNull: value must not be null

            message:
              - Length: must not exceed 255 characters 
              - NotBlank: string must not be null nor empty
        "401":
          $ref: "schemas/errors/unauthorized.yaml"
        "403":
          $ref: "schemas/errors/forbidden.yaml"
          description: >
            Possible errors `type`s: USER_IDENTITY_MISMATCH, FORBIDDEN_CONVERSATION

