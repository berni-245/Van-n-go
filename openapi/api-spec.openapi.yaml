components:
  parameters:
    ClientIdPath:
      name: clientId
      in: path
      required: true
      description: ID of the client
      schema:
        type: integer
    DriverIdPath:
      in: path
      name: driverId
      required: true
      description: ID of the driver
      schema:
        type: integer
    DriverIdQuery:
      name: driverId
      in: query
      required: true
      description: ID of the driver
      schema:
        type: integer
    BookingIdQuery:
      name: bookingId
      in: query
      required: true
      description: ID of the booking
      schema:
        type: integer
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      description: ID of the vehicle
      schema:
        type: integer
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      description: ID of the booking
      schema:
        type: integer
    ZoneIdPath:
      name: zoneId
      in: path
      required: true
      description: ID of the zone
      schema:
        type: integer
    ClientIdQuery:
      name: clientId
      in: query
      required: true
      description: ID of the client
      schema:
        type: integer
    PaginationQuery:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        default: 1
    MustHaveAvailabilityQuery:
      name: mustHaveAvailability
      in: query
      description: Indicates if the vehicles must have availability (true) or if it's not needed (false)
      schema:
        type: boolean
        default: false
    ZoneQuery:
      name: zoneId
      in: query
      required: true
      description: ID of the zone
      schema:
        type: integer
    OptionalZoneQuery:
      name: zoneId
      in: query
      required: false
      description: ID of the zone
      schema:
        type: integer
    SizeQuery:
      name: size
      description: Vehicles of an specific size
      in: query
      required: false
      schema:
        $ref: "schemas/enums/vehicle-size.yaml"
    MaxPriceQuery:
      name: maxPrice
      description: Vehicles whose hourly rate is lower that specified value
      in: query
      required: false
      schema:
        type: number
        format: float
    WeekDayQuery:
      name: weekDay
      description: Vehicles who have availability on the specified day
      in: query
      required: false
      schema:
        $ref: "schemas/enums/day.yaml"
    MinRatingQuery:
      name: minRating
      description: Drivers whose rating is above the specified value
      in: query
      required: false
      schema:
        type: integer
    SortOrderQuery:
      name: sortOrder
      description: Sort drivers by the specified criteria
      in: query
      required: false
      schema:
        type: string
        default: ALPHABETICAL
        enum: [ ALPHABETICAL, "LEAST_PRICE", "BEST_RATING" ]