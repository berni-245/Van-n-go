description: >
  A registered user of the application who has vehicles and can get his services requested
  by a client.
type: object
required: [ id, username, description, rating ]
properties:
  id:
    type: integer
    example: 13
  username:
    type: string
    example: Berni's Fletes
  description:
    type: string
    example: Best fletes in Adrogué.
  rating:
    type: number
    minimum: 0
    maximum: 5
    example: 4.3
  self:
    type: string
    example: /api/drivers/13
  profilePic:
    type: string
    example: /api/drivers/13/profile-picture
  hasProfilePic:
    type: boolean
    example: true
  vehicles:
    type: string
    example: /api/driver/13/vehicles
