<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:remove="all">Password Recovery</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        .button-primary {
            display: inline-block;
            font-weight: 400;
            color: #fff;
            text-align: center;
            vertical-align: middle;
            user-select: none;
            background-color: #0d6efd;
            border: 1px solid #0d6efd;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.375rem;
            transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
            border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            cursor: pointer;
            text-decoration: none;
        }

        .button-primary a {
            color: inherit;
            text-decoration: none;
            display: inline-block;
        }

        .button-primary a:hover {
            color: inherit;
        }
    </style>
</head>
<body style="background-color: #f8f9fa; font-family: Arial, sans-serif; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 5px; padding: 20px; box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);">

    <h2 class="text-center m-2" th:text="#{mail.passwordRecover.greetingUser(${userName})}">Hello, User</h2>

    <p th:text="#{mail.passwordRecover.message}" style="color: #343a40;">We received a request to reset your password. Use the token below and click the button to proceed with the recovery process.</p>

    <div style="background-color: #f1f3f5; border: 1px dashed #ced4da; padding: 15px; border-radius: 5px; margin: 20px 0; text-align: center;">
        <p style="margin: 0; font-size: 16px; color: #495057;" th:utext="#{mail.passwordRecover.token(${token})}">Your recovery token is: <strong>123456</strong></p>
    </div>

    <div class="text-center" style="margin: 20px 0;">
        <button class="button-primary">
            <a th:href="${actionUrl}" style="color: white"
               th:text="#{mail.passwordRecover.action}">Recover Password</a>
        </button>
    </div>

    <p th:text="#{mail.passwordRecover.ignore}" style="color: #6c757d; font-size: 14px;">If you did not request a password reset, you can safely ignore this email.</p>

    <footer th:text="#{mail.footer}" class="text-center m-2" style="color: #6c757d; font-size: 12px; border-top: 1px solid #e9ecef; padding-top: 10px;">Thanks for using Van N' Go</footer>
</div>
</body>
</html>
